version: '3.8'

services:
  vllm-speculative-gateway:
    build: .
    container_name: vllm-speculative-gateway
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - TARGET_MODEL=meta-llama/Llama-3.3-70B-Instruct
      - DRAFT_MODEL=meta-llama/Llama-3.2-1B-Instruct
      - NUM_SPECULATIVE_TOKENS=4
    restart: unless-stopped
